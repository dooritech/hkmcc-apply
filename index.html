<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>신자 및 가족 선물 등록 프로그램</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; }
    .container { max-width: 500px; margin: 0 auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #1a73e8; margin-top: 0; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; }
    input, select { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
    .row-group { display: flex; gap: 10px; }
    .member-box { border: 1px dashed #1a73e8; padding: 12px; border-radius: 6px; margin-bottom: 10px; background-color: #f8fbff; position: relative; }
    .btn { width: 100%; padding: 12px; background: #1a73e8; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 10px; }
    .btn:hover { background: #1557b0; }
    .btn-add { background: #34a853; margin-top: 5px; margin-bottom: 15px; }
    .btn-add:hover { background: #2e8b46; }
    .btn-del { background: #ea4335; padding: 5px 10px; font-size: 12px; width: auto; position: absolute; top: 10px; right: 10px; border-radius: 3px; }
    .loading { text-align: center; color: #666; font-style: italic; display: none; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="container">
    <h2>🎁 신자 및 가족 선물 등록</h2>
    <form id="regForm">
      
      <!-- 구역 및 반 -->
      <div class="form-group">
        <label>구역 및 반</label>
        <div class="row-group">
          <input type="text" id="zone" placeholder="구역 (예: 노스산호세)" required>
          <input type="text" id="ban" placeholder="반 (예: 1)" style="width: 100px;" required>
        </div>
      </div>

      <!-- 연락처 및 주소 (가족 공통) -->
      <div class="form-group">
        <label>연락처 및 주소 (선택)</label>
        <input type="text" id="phone" placeholder="전화번호" style="margin-bottom: 8px;">
        <input type="text" id="address" placeholder="주소" style="margin-bottom: 8px;">
        <div class="row-group">
          <input type="text" id="city" placeholder="City">
          <input type="text" id="zipcode" placeholder="Zipcode" style="width: 120px;">
        </div>
      </div>

      <div class="form-group">
        <label>선물 수령 상태</label>
        <select id="gift">
          <option value="미수령" selected>미수령</option>
          <option value="완료">완료</option>
        </select>
      </div>

      <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">

      <!-- 신자 구성원 입력 영역 -->
      <label>가족 구성원 정보</label>
      <div id="membersContainer">
        <div class="member-box">
          <label style="font-size: 13px; color: #1a73e8; margin-bottom: 5px;">대표 신자</label>
          <div class="row-group">
            <input type="text" class="m-name" placeholder="이름 (필수)" required>
            <input type="text" class="m-baptism" placeholder="세례명">
          </div>
        </div>
      </div>

      <button type="button" class="btn btn-add" onclick="addMemberField()">+ 가족 구성원 추가하기</button>
      <button type="submit" class="btn" id="subBtn">일괄 등록하기</button>
      <div id="loadingText" class="loading">등록 처리 중입니다 잠시만 기다려주세요...</div>
    </form>
  </div>

  <script>
    // ⚠️ 1단계에서 복사한 구글 앱스 스크립트 웹 앱 URL을 여기에 붙여넣으세요!
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzQTzyY0zCH-dE3yWXB-IFLFbZRHjkjy4WfztdXCuF3735JpUJjAdYgYJP6Q_Tedvzm/exec"; 

    // 가족 구성원 입력 칸 동적 추가 함수
    function addMemberField() {
      const container = document.getElementById('membersContainer');
      const div = document.createElement('div');
      div.className = 'member-box';
      div.innerHTML = `
        <button type="button" class="btn btn-del" onclick="this.parentElement.remove()">삭제</button>
        <label style="font-size: 13px; color: #555; margin-bottom: 5px;">가족 구성원</label>
        <div class="row-group">
          <input type="text" class="m-name" placeholder="이름 (필수)" required>
          <input type="text" class="m-baptism" placeholder="세례명">
        </div>
      `;
      container.appendChild(div);
    }

    // 폼 제출 이벤트 처리
    document.getElementById('regForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      if (APPS_SCRIPT_URL.includes("YOUR_GOOGLE_APPS_SCRIPT")) {
        alert("코드 내에 구글 앱스 스크립트 웹 앱 URL을 먼저 입력해 주세요!");
        return;
      }

      const names = document.querySelectorAll('.m-name');
      const baptisms = document.querySelectorAll('.m-baptism');
      let members = [];
      
      for(let i = 0; i < names.length; i++) {
        members.push({
          name: names[i].value,
          baptismName: baptisms[i].value
        });
      }

      const payload = {
        action: 'registerMembers',
        zone: document.getElementById('zone').value,
        ban: document.getElementById('ban').value,
        phone: document.getElementById('phone').value,
        address: document.getElementById('address').value,
        city: document.getElementById('city').value,
        zipcode: document.getElementById('zipcode').value,
        gift: document.getElementById('gift').value,
        members: members
      };

      const btn = document.getElementById('subBtn');
      const loading = document.getElementById('loadingText');
      btn.disabled = true;
      loading.style.display = 'block';

      try {
        const response = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        const result = await response.json();
        
        if(result.success) {
          alert(`🎉 등록이 성공적으로 완료되었습니다!\n\n• 부여된 가족 ID (FID): ${result.fid}\n• 등록된 인원 수: ${result.count}명`);
          document.getElementById('regForm').reset();
          // 입력창 초기화 후 대표 신자 칸 1개만 남기기
          document.getElementById('membersContainer').innerHTML = `
            <div class="member-box">
              <label style="font-size: 13px; color: #1a73e8; margin-bottom: 5px;">대표 신자</label>
              <div class="row-group">
                <input type="text" class="m-name" placeholder="이름 (필수)" required>
                <input type="text" class="m-baptism" placeholder="세례명">
              </div>
            </div>
          `;
        } else {
          alert('등록 실패: ' + (result.error || result.message));
        }
      } catch (err) {
        console.error(err);
        alert('서버 통신 중 오류가 발생했습니다. 네트워크 상태나 URL을 확인해주세요.');
      } finally {
        btn.disabled = false;
        loading.style.display = 'none';
      }
    });
  </script>
</body>
</html>
